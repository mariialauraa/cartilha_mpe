<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Diagrama de Casos de Uso — Guia Digital MPE</title>
  <desc id="description">Diagrama simplificado das ações do usuário, incluindo a realização da autoavaliação e a visualização dos resultados.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #173653; }
      .title { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .boundary { fill: #ffffff; stroke: #173653; stroke-width: 2.5; }
      .boundary-title { font-size: 20px; font-weight: 700; }
      .usecase { fill: #f4f9fc; stroke: #173653; stroke-width: 2.2; }
      .case-label { font-size: 17px; text-anchor: middle; }
      .actor { stroke: #173653; stroke-width: 3; fill: none; stroke-linecap: round; }
      .actor-label { font-size: 16px; font-weight: 700; text-anchor: middle; }
      .association { stroke: #64748b; stroke-width: 1.8; fill: none; }
      .include { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
      .relation-label { font-size: 14px; fill: #475569; }
      .note { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.3; }
      .note-text { font-size: 14px; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>
  <text class="title" x="600" y="46" text-anchor="middle">Diagrama de Casos de Uso — Guia Digital MPE</text>

  <rect class="boundary" x="255" y="95" width="900" height="555" rx="4"/>
  <text class="boundary-title" x="705" y="130" text-anchor="middle">Guia Digital MPE</text>

  <g class="association">
    <path d="M165 360 L575 190"/>
    <path d="M165 360 L575 280"/>
    <path d="M165 360 L575 370"/>
    <path d="M165 360 L575 465"/>
    <path d="M165 360 L575 560"/>
  </g>
  <path class="include" d="M790 465 L790 560"/>
  <text class="relation-label" x="805" y="520">«include»</text>

  <g class="actor">
    <circle cx="125" cy="285" r="20"/>
    <path d="M125 305 L125 375 M88 330 L162 330 M125 375 L92 420 M125 375 L158 420"/>
  </g>
  <text class="actor-label" x="125" y="448">Usuário MPE</text>

  <g>
    <ellipse class="usecase" cx="690" cy="190" rx="215" ry="38"/>
    <text class="case-label" x="690" y="196">Acessar página inicial</text>

    <ellipse class="usecase" cx="690" cy="280" rx="215" ry="38"/>
    <text class="case-label" x="690" y="274">
      <tspan x="690" dy="0">Consultar conteúdo sobre</tspan>
      <tspan x="690" dy="21">transformação digital</tspan>
    </text>

    <ellipse class="usecase" cx="690" cy="370" rx="215" ry="38"/>
    <text class="case-label" x="690" y="364">
      <tspan x="690" dy="0">Consultar ferramentas</tspan>
      <tspan x="690" dy="21">digitais</tspan>
    </text>

    <ellipse class="usecase" cx="690" cy="465" rx="215" ry="38"/>
    <text class="case-label" x="690" y="471">Realizar autoavaliação</text>

    <ellipse class="usecase" cx="690" cy="560" rx="215" ry="38"/>
    <text class="case-label" x="690" y="554">
      <tspan x="690" dy="0">Visualizar resultado</tspan>
      <tspan x="690" dy="21">da autoavaliação</tspan>
    </text>
  </g>

  <rect class="note" x="885" y="430" width="235" height="105" rx="6"/>
  <text class="note-text" x="1002" y="460" text-anchor="middle">
    <tspan x="1002" dy="0">O último resultado fica salvo</tspan>
    <tspan x="1002" dy="21">neste navegador e pode ser</tspan>
    <tspan x="1002" dy="21">consultado depois.</tspan>
  </text>
</svg>
