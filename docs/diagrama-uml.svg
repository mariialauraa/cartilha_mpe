<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1000" viewBox="0 0 1480 1000" role="img" aria-labelledby="title description">
  <title id="title">Diagrama UML — Guia Digital MPE</title>
  <desc id="description">Estrutura real da aplicação React, rotas, autoavaliação, tipos usados, classificação dos resultados e armazenamento local das respostas.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52708b"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #173653; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #526579; }
      .package { fill: #f7fafc; stroke: #8ba9c2; stroke-width: 1.6; }
      .package-title-bg { fill: #dceaf5; stroke: #8ba9c2; stroke-width: 1.2; }
      .package-title { font-size: 17px; font-weight: 700; }
      .box { fill: #ffffff; stroke: #2d6c9e; stroke-width: 1.8; }
      .external { fill: #f0fbfc; stroke: #2194a3; stroke-width: 1.8; }
      .box-head { font-size: 12px; font-style: italic; fill: #526579; }
      .box-name { font-size: 16px; font-weight: 700; }
      .field { font-size: 13px; fill: #263f56; }
      .small { font-size: 12px; fill: #526579; }
      .divider { stroke: #2d6c9e; stroke-width: 1.3; }
      .solid { stroke: #52708b; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .dependency { stroke: #52708b; stroke-width: 1.7; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
      .relation { font-size: 12px; fill: #526579; }
    </style>
  </defs>

  <rect width="1480" height="1000" fill="#ffffff"/>
  <text class="title" x="740" y="46" text-anchor="middle">Diagrama UML — Guia Digital MPE</text>
  <text class="subtitle" x="740" y="72" text-anchor="middle">Componentes, rotas, autoavaliação e persistência de respostas</text>

  <rect class="package" x="35" y="100" width="1410" height="330" rx="10"/>
  <rect class="package-title-bg" x="48" y="88" width="250" height="34" rx="10"/>
  <text class="package-title" x="65" y="111">Aplicação e páginas</text>

  <path class="solid" d="M740 236 L190 302"/>
  <path class="solid" d="M740 236 L740 302"/>
  <path class="solid" d="M740 236 L1290 302"/>

  <g>
    <rect class="box" x="575" y="135" width="330" height="105" rx="5"/>
    <text class="box-head" x="740" y="157" text-anchor="middle">«componente React»</text>
    <text class="box-name" x="740" y="181" text-anchor="middle">App</text>
    <line class="divider" x1="575" y1="190" x2="905" y2="190"/>
    <text class="field" x="590" y="210">Header • Routes • Footer</text>
    <text class="field" x="590" y="229">useLocation / useLayoutEffect</text>

    <rect class="box" x="70" y="302" width="240" height="92" rx="5"/>
    <text class="box-head" x="190" y="323" text-anchor="middle">«componente React»</text>
    <text class="box-name" x="190" y="347" text-anchor="middle">Header</text>
    <line class="divider" x1="70" y1="357" x2="310" y2="357"/>
    <text class="field" x="85" y="379">Links de navegação</text>

    <rect class="box" x="360" y="302" width="760" height="92" rx="5"/>
    <text class="box-head" x="740" y="323" text-anchor="middle">«React Router» — Routes / Route</text>
    <line class="divider" x1="360" y1="333" x2="1120" y2="333"/>
    <text class="field" x="380" y="354">/ → Home</text>
    <text class="field" x="555" y="354">/transformacao-digital → TransformacaoDigital</text>
    <text class="field" x="380" y="379">/ferramentas-digitais → FerramentasDigitais</text>
    <text class="field" x="795" y="379">/autoavaliacao → Autoavaliacao</text>

    <rect class="box" x="1170" y="302" width="240" height="92" rx="5"/>
    <text class="box-head" x="1290" y="323" text-anchor="middle">«componente React»</text>
    <text class="box-name" x="1290" y="347" text-anchor="middle">Footer</text>
    <line class="divider" x1="1170" y1="357" x2="1410" y2="357"/>
    <text class="field" x="1185" y="379">Informações do projeto</text>
  </g>
  <text class="relation" x="195" y="270">renderiza</text>
  <text class="relation" x="750" y="270">define as rotas</text>
  <text class="relation" x="1260" y="270">renderiza</text>

  <rect class="package" x="35" y="465" width="1410" height="495" rx="10"/>
  <rect class="package-title-bg" x="48" y="453" width="300" height="34" rx="10"/>
  <text class="package-title" x="65" y="476">Autoavaliação e tipos</text>

  <g class="dependency">
    <path d="M430 590 L480 590"/>
    <path d="M430 625 L850 590"/>
    <path d="M430 650 L480 755"/>
    <path d="M430 680 L850 780"/>
    <path d="M1020 665 L1020 710"/>
    <path d="M1220 790 L1190 790"/>
  </g>
  <text class="relation" x="438" y="578">usa dados</text>
  <text class="relation" x="530" y="646">usa ferramentas</text>
  <text class="relation" x="600" y="730">soma respostas</text>
  <text class="relation" x="850" y="705">combina dados da ferramenta</text>
  <text class="relation" x="1100" y="778">retorna Classificacao</text>

  <g>
    <rect class="box" x="70" y="535" width="360" height="185" rx="5"/>
    <text class="box-head" x="250" y="557" text-anchor="middle">«componente React»</text>
    <text class="box-name" x="250" y="582" text-anchor="middle">Autoavaliacao</text>
    <line class="divider" x1="70" y1="592" x2="430" y2="592"/>
    <text class="field" x="88" y="614">etapa: Etapa</text>
    <text class="field" x="88" y="635">perguntaAtual: number</text>
    <text class="field" x="88" y="656">respostas: Respostas</text>
    <text class="field" x="88" y="677">respostasSalvas: Respostas | null</text>
    <text class="field" x="88" y="703">Avança, calcula e exibe resultados</text>

    <rect class="box" x="480" y="520" width="340" height="145" rx="5"/>
    <text class="box-head" x="650" y="542" text-anchor="middle">«type»</text>
    <text class="box-name" x="650" y="567" text-anchor="middle">Pergunta</text>
    <line class="divider" x1="480" y1="577" x2="820" y2="577"/>
    <text class="field" x="498" y="600">id: number</text>
    <text class="field" x="498" y="622">categoria: string</text>
    <text class="field" x="498" y="644">texto: string</text>

    <rect class="box" x="850" y="520" width="340" height="145" rx="5"/>
    <text class="box-head" x="1020" y="542" text-anchor="middle">«type»</text>
    <text class="box-name" x="1020" y="567" text-anchor="middle">Ferramenta</text>
    <line class="divider" x1="850" y1="577" x2="1190" y2="577"/>
    <text class="field" x="868" y="600">nome, secao, textoLink: string</text>
    <text class="field" x="868" y="622">perguntas: number[]</text>
    <text class="field" x="868" y="644">recomendacao: string</text>

    <rect class="box" x="1220" y="520" width="190" height="145" rx="5"/>
    <text class="box-head" x="1315" y="542" text-anchor="middle">«type»</text>
    <text class="box-name" x="1315" y="567" text-anchor="middle">Etapa</text>
    <line class="divider" x1="1220" y1="577" x2="1410" y2="577"/>
    <text class="field" x="1237" y="600">"inicio"</text>
    <text class="field" x="1237" y="622">"questionario"</text>
    <text class="field" x="1237" y="644">"conclusao"</text>

    <rect class="box" x="480" y="710" width="340" height="110" rx="5"/>
    <text class="box-head" x="650" y="732" text-anchor="middle">«type»</text>
    <text class="box-name" x="650" y="757" text-anchor="middle">Respostas</text>
    <line class="divider" x1="480" y1="767" x2="820" y2="767"/>
    <text class="field" x="498" y="791">Record&lt;number, number&gt;</text>
    <text class="small" x="498" y="810">Índice da alternativa selecionada por pergunta</text>

    <rect class="box" x="850" y="710" width="340" height="145" rx="5"/>
    <text class="box-head" x="1020" y="732" text-anchor="middle">«objeto calculado»</text>
    <text class="box-name" x="1020" y="757" text-anchor="middle">Resultado por ferramenta</text>
    <line class="divider" x1="850" y1="767" x2="1190" y2="767"/>
    <text class="field" x="868" y="790">pontos: number (0–9)</text>
    <text class="field" x="868" y="812">percentual: number</text>
    <text class="field" x="868" y="834">classificacao: Classificacao</text>
    <text class="small" x="868" y="850">Combina os dados da Ferramenta</text>

    <rect class="box" x="1220" y="710" width="190" height="145" rx="5"/>
    <text class="box-head" x="1315" y="732" text-anchor="middle">«função»</text>
    <text class="box-name" x="1315" y="757" text-anchor="middle">obterClassificacao</text>
    <line class="divider" x1="1220" y1="767" x2="1410" y2="767"/>
    <text class="field" x="1237" y="790">pontos: number</text>
    <text class="field" x="1237" y="812">retorna Classificacao</text>
    <text class="small" x="1237" y="834">0–3 inicial</text>
    <text class="small" x="1237" y="850">4–6 moderado • 7–9 frequente</text>

    <rect class="external" x="70" y="770" width="360" height="120" rx="5"/>
    <text class="box-head" x="250" y="792" text-anchor="middle">«armazenamento do navegador»</text>
    <text class="box-name" x="250" y="817" text-anchor="middle">localStorage</text>
    <line class="divider" x1="70" y1="827" x2="430" y2="827"/>
    <text class="field" x="88" y="850">Chave: autoavaliacao-respostas</text>
    <text class="small" x="88" y="873">Salva e recupera as respostas concluídas</text>
  </g>

  <path class="dependency" d="M250 720 L250 770"/>
  <text class="relation" x="265" y="752">lê / salva respostas</text>
  <text class="subtitle" x="740" y="930" text-anchor="middle">Perguntas, ferramentas e tipos são definidos no componente; a classificação está em utils/classificacao.ts.</text>
</svg>
